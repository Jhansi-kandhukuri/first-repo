<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="tag">GitHub Actions Demo</p>
    <h1>CI/CD is working 🚀</h1>
    <p>This tiny web app is deployed automatically whenever changes are pushed to the <strong>main</strong> branch.</p>

    <div class="pipeline" aria-label="CI/CD pipeline">
      <span>Code</span><b>→</b><span>CI</span><b>→</b><span>Deploy</span><b>→</b><span>Website</span>
    </div>

    <div class="actions">
      <button class="action-btn" data-message="CI checks started! 🔍">Run CI</button>
      <button class="action-btn" data-message="Deployment completed! 🚀">Deploy</button>
    </div>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
